<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan css</title>
    <style>
        p{
            font-family:Georgia, 'Times New Roman', Times, serif;
            color:blue;
            font-weight: 500; 
        } 
        .momo{
            font-style: italic;
            color:blueviolet;
            font-family: monospace;
        }
        .ayam{
            color:deepskyblue;
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <p style="font-weight: bold; color:rgb(150, 20, 20);">Ini kalimat pertama</p> <!-- ini inline  css stylenya didalem p-->
    <p>Ini Kalimat kedua</p>
    <p class="momo">Ini kalimat ketiga</p> <!--ini pake class class itu di head ada titiknya-->
    <p class="ayam">Ini kalimat keempat</p>

</body>
</html>
